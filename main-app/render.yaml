# Render Deployment Configuration for main-app
# This file is used by Render when deploying from the monorepo
# Reference: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: pause-protect-backend
    env: node
    plan: standard
    # Important: Point to main-app subdirectory since this is a monorepo
    rootDir: main-app
    # On Free plan, include npm ci in the build command (no Pre-Deploy Command available)
    # npm ci is more reliable than npm install for production deployments
    # Use --legacy-peer-deps to handle langchain peer dependency conflicts
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BASE_URL
        sync: false
    envVarGroups:
      - name: firebase
      - name: api-keys
      - name: database
